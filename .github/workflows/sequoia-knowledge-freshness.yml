name: Sequoia knowledge freshness

on:
  pull_request:
  schedule:
    - cron: "23 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify catalog freshness and public sources
        run: node --test scripts/sequoia-knowledge-interface.test.mjs
